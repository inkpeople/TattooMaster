name: Build TattooMaster APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'tattoo-android.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -o tattoo-android.zip -d extracted -x '.github/workflows/*'
          test -f extracted/settings.gradle
          test -f extracted/app/build.gradle
          test -f extracted/app/src/main/AndroidManifest.xml

      - name: Install Gradle 8.7
        run: |
          curl -L --fail https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: extracted
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TattooMaster-apk
          path: extracted/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
