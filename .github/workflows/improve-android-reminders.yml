name: Improve Android reminders
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/improve-android-reminders.yml'
permissions:
  contents: write
jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Patch Android notification recovery
        run: |
          set -e
          mkdir work
          unzip -q tattoo-android.zip -d work
          python3 - <<'PY'
          from pathlib import Path
          root=Path("work")
          boot=root/"app/src/main/java/ru/tattoo/master/BootReceiver.java"
          boot.write_text("""package ru.tattoo.master;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (intent == null) return;
                  String action = intent.getAction();
                  if (Intent.ACTION_BOOT_COMPLETED.equals(action)
                          || Intent.ACTION_MY_PACKAGE_REPLACED.equals(action)
                          || Intent.ACTION_TIME_CHANGED.equals(action)
                          || Intent.ACTION_TIMEZONE_CHANGED.equals(action)) {
                      String saved = context.getSharedPreferences("tm", Context.MODE_PRIVATE)
                              .getString("al", "[]");
                      Sched.set(context, saved);
                  }
              }
          }
          """, encoding="utf-8")
          manifest=root/"app/src/main/AndroidManifest.xml"
          text=manifest.read_text(encoding="utf-8")
          old='<intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter>'
          new='''<intent-filter>
                      <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                      <action android:name="android.intent.action.TIME_SET"/>
                      <action android:name="android.intent.action.TIMEZONE_CHANGED"/>
                  </intent-filter>'''
          if old not in text:
              raise SystemExit("Expected boot receiver intent filter not found; refusing to patch")
          manifest.write_text(text.replace(old,new),encoding="utf-8")
          PY
          rm -f tattoo-android.zip
          (cd work && zip -qr ../tattoo-android.zip .)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tattoo-android.zip
          git commit -m "Improve Android reminder recovery"
          git push
      - name: Build debug APK
        run: |
          mkdir build-src
          unzip -q tattoo-android.zip -d build-src
          cd build-src
          gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TattooMaster-apk
          path: build-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
